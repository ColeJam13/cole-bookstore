<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
    xmlns:h="http://java.sun.com/jsf/html" 
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets" 
    xmlns:p="http://primefaces.org/ui"
    template="/pages/layouts/customer-template.xhtml">

    <h:head>
        <title>#{appmsg['label.login.error.heading']}</title>
    </h:head>
    <ui:define name="body">
        <h:outputStylesheet library="css" name="forms.css" />
        <div class="profileDetail" style="max-width:500px; margin:40px auto; padding:30px; text-align:center;">
            <h3>#{appmsg['label.login.error.heading']}</h3>
            <p style="color:#e8d5b0; font-family:'EB Garamond', serif; margin:20px 0;">
                #{appmsg['label.login.error.message']}
            </p>
            <h:link outcome="login" value="#{appmsg['label.login.error.return']}" style="color:#c9a84c;" />
        </div>
    </ui:define>
</ui:composition>
