<ui:composition 
	xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:p="http://primefaces.org/ui">

	<!-- Full width banner image -->
	<div id="banner">
		<p:graphicImage library="images" name="ColependiumHeader.png" />
	</div>

	<!-- Navigation bar sitting below the banner -->
	<div id="navbar">
		<h:form id="navForm">
			<p:commandLink value="Home" action="home" styleClass="navLink"/>
			<p:commandLink value="Login" action="login" styleClass="navLink" rendered="#{!userProvider.userLoggedIn}"/>
			<p:commandLink value="Logout" action="#{userProvider.logout()}" styleClass="navLink" rendered="#{userProvider.userLoggedIn}"/>
			<p:commandLink value="Admin" action="admin" styleClass="navLink" rendered="#{userProvider.adminUser}"/>
			<p:outputLabel value="Welcome: #{userProvider.userName}" styleClass="navLink" rendered="#{userProvider.userLoggedIn}"/>
		</h:form>
	</div>

</ui:composition>
