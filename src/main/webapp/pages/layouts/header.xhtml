<ui:composition 
	xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" 
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:pe="http://primefaces.org/ui/extensions"
	xmlns:p="http://primefaces.org/ui">

	<!-- Full width banner image -->
	<div id="banner">
		<p:graphicImage library="images" name="ColependiumHeader.png" />
	</div>

	<!-- Navigation bar sitting below the banner -->
	<div id="navbar">
		<h:form id="navForm">
			<p:commandLink value="Home" action="home" styleClass="navLink" ajax="false"/>
			<p:commandLink value="Login" action="admin" styleClass="navLink" rendered="#{!userProvider.userLoggedIn}" ajax="false"/>
			<p:commandLink value="Logout" action="#{userProvider.logout()}" styleClass="navLink" rendered="#{userProvider.userLoggedIn}" ajax="false"/>
			<p:commandLink value="Dashboard" action="dashboard" styleClass="navLink" rendered="#{userProvider.adminUser}" ajax="false" />
			<p:commandLink value="Orders" action="orders" styleClass="navLink" rendered="#{userProvider.adminUser}" ajax="false" />
			<p:commandLink value="Inventory" action="inventory" styleClass="navLink" rendered="#{userProvider.adminUser}" ajax="false" />
			<p:outputLabel value="Welcome: #{userProvider.userName}" styleClass="navLink" rendered="#{userProvider.userLoggedIn}"/>
			<p:commandLink value="Cart (#{cartForm.cartItems.size()})" action="cart" styleClass="navLink" ajax="false" />
		</h:form>
	</div>
</ui:composition>
