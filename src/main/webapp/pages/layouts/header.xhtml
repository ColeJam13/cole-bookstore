<ui:composition 
    xmlns="http://www.w3.org/1999/xhtml" 
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:ui="http://java.sun.com/jsf/facelets" 
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:pe="http://primefaces.org/ui/extensions"
    xmlns:p="http://primefaces.org/ui">
	
	<div id="banner-wrap">
		<div id="banner">
			<p:graphicImage library="images" name="ColependiumHeader.png" />
		</div>
		<div class="cubby cubby-left">
			<div class="candle-wrap candle-sm">
				<div class="flame-wrap">
					<div class="flame-outer" style="animation-duration:0.52s; animation-delay:0.1s"></div>
					<div class="flame-mid" style="animation-duration:0.41s; animation-delay:0.2s"></div>
					<div class="flame-core"></div>
				</div>
				<div class="wick"></div>
				<div class="candle-body">
					<div class="candle-drip"></div>
					<div class="candle-drip2"></div>
				</div>
				<div class="holder-cup"></div>
				<div class="holder-stem"></div>
				<div class="holder-base"></div>
			</div>
			<div class="candle-wrap candle-md">
				<div class="flame-wrap">
					<div class="flame-outer" style="animation-duration:0.45s; animation-delay:0.05s"></div>
					<div class="flame-mid" style="animation-duration:0.38s; animation-delay:0.15s"></div>
					<div class="flame-core"></div>
				</div>
				<div class="wick"></div>
				<div class="candle-body">
					<div class="candle-drip"></div>
					<div class="candle-drip2"></div>
				</div>
				<div class="holder-cup"></div>
				<div class="holder-stem"></div>
				<div class="holder-base"></div>
			</div>
			<div class="candle-wrap candle-lg">
				<div class="flame-wrap">
					<div class="flame-outer" style="animation-duration:0.39s; animation-delay:0.0s"></div>
					<div class="flame-mid" style="animation-duration:0.31s; animation-delay:0.1s"></div>
					<div class="flame-core"></div>
				</div>
				<div class="wick"></div>
				<div class="candle-body">
					<div class="candle-drip"></div>
					<div class="candle-drip2"></div>
				</div>
				<div class="holder-cup"></div>
				<div class="holder-stem"></div>
				<div class="holder-base"></div>
			</div>
		</div>
		<div class="cubby cubby-right">
			<div class="candle-wrap candle-lg">
				<div class="flame-wrap">
					<div class="flame-outer" style="animation-duration:0.41s; animation-delay:0.08s"></div>
					<div class="flame-mid" style="animation-duration:0.33s; animation-delay:0.18s"></div>
					<div class="flame-core"></div>
				</div>
				<div class="wick"></div>
				<div class="candle-body">
					<div class="candle-drip"></div>
					<div class="candle-drip2"></div>
				</div>
				<div class="holder-cup"></div>
				<div class="holder-stem"></div>
				<div class="holder-base"></div>
			</div>
			<div class="candle-wrap candle-md">
				<div class="flame-wrap">
					<div class="flame-outer" style="animation-duration:0.47s; animation-delay:0.12s"></div>
					<div class="flame-mid" style="animation-duration:0.36s; animation-delay:0.0s"></div>
					<div class="flame-core"></div>
				</div>
				<div class="wick"></div>
				<div class="candle-body">
					<div class="candle-drip"></div>
					<div class="candle-drip2"></div>
				</div>
				<div class="holder-cup"></div>
				<div class="holder-stem"></div>
				<div class="holder-base"></div>
			</div>
			<div class="candle-wrap candle-sm">
				<div class="flame-wrap">
					<div class="flame-outer" style="animation-duration:0.55s; animation-delay:0.07s"></div>
					<div class="flame-mid" style="animation-duration:0.43s; animation-delay:0.17s"></div>
					<div class="flame-core"></div>
				</div>
				<div class="wick"></div>
				<div class="candle-body">
					<div class="candle-drip"></div>
					<div class="candle-drip2"></div>
				</div>
				<div class="holder-cup"></div>
				<div class="holder-stem"></div>
				<div class="holder-base"></div>
			</div>
		</div>
	</div>
    <div id="navbar">
        <h:form id="navForm">
            <p:commandLink value="#{appmsg['label.nav.home']}" action="home" styleClass="navLink" ajax="false" />
            <p:commandLink value="#{appmsg['label.nav.login']}" onclick="PF('loginDialog').show()" styleClass="navLink" rendered="#{!userProvider.userLoggedIn}" />
            <p:commandLink value="#{appmsg['label.nav.myaccount']}" action="profile" styleClass="navLink" rendered="#{userProvider.generalUser}" ajax="false" />
            <p:commandLink value="#{appmsg['label.nav.logout']}" action="#{userProvider.logout()}" styleClass="navLink" rendered="#{userProvider.userLoggedIn}" ajax="false"/>
            <p:commandLink value="#{appmsg['label.nav.dashboard']}" action="dashboard" styleClass="navLink" rendered="#{userProvider.adminUser}" ajax="false" />
            <p:commandLink value="#{appmsg['label.nav.orders']}" action="orders" styleClass="navLink" rendered="#{userProvider.adminUser}" ajax="false" />
            <p:commandLink value="#{appmsg['label.nav.inventory']}" action="inventory" styleClass="navLink" rendered="#{userProvider.adminUser}" ajax="false" />
            <span class="navSpacer">|</span>
			<p:outputLabel value="#{appmsg['label.nav.welcome']}: #{userProvider.userName}" styleClass="navLink" rendered="#{userProvider.userLoggedIn}"/>
			<p:commandLink value="#{appmsg['label.nav.cart']} (#{cartForm.cartItems.size()})" action="cart" styleClass="navLink cartLink" ajax="false" />
		</h:form>
    </div>
</ui:composition>
