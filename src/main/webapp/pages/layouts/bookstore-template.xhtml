<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE HTML PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">
	
<h:head>
	<title>KSM Bookstore Application</title>
</h:head>
<h:body>
  	<h:outputStylesheet library="css" name="bookstore.css" />
	<div id="wrapper">
		<div id="header">
			<ui:include src="header.xhtml"/>
		</div>
		
        <ui:insert name="menu"/>
		
        <ui:insert name="body"/>
        
	    <div id="footer" class="fullPage">
	    	<ui:insert name="footer" >
	    	  <ui:include src="footer.xhtml" />
	    	</ui:insert>
    	</div>
	</div>
	<ui:insert name="scriptblock" />
	<p:dialog header="Login" widgetVar="loginDialog" modal="true" appendTo="@none">
		<h:form id="loginForm">
			<p:messages id="loginMessages" showDetail="true" />
			<h:outputLabel value="Username: " />
			<p:inputText value="#{loginController.username}" />
			<h:outputLabel value="Password: " />
			<p:password value="#{loginController.password}" />
			<p:commandButton value="Login" action="#{loginController.login()}" update="loginMessages" process="@form @this" oncomplete="if(!args.validationFailed) PF('loginDialog').hide()" />
		</h:form>
	</p:dialog>
</h:body>
</html>
