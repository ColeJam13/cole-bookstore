<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE HTML PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>#{appmsg['label.app.title']}</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&amp;family=EB+Garamond:wght@400;500&amp;display=swap" />
</h:head>
<h:body>
	<h:outputStylesheet library="css" name="primeflex.min.css" />
    <h:outputStylesheet library="css" name="bookstore.css" />
    <h:outputStylesheet library="css" name="banner.css" />
    <h:outputStylesheet library="css" name="navbar.css" />
    <div id="wrapper">
        <div id="header">
            <ui:include src="header.xhtml"/>
        </div>
        <ui:insert name="menu"/>
        <ui:insert name="body"/>
        <div id="footer" class="fullPage">
            <ui:insert name="footer">
                <ui:include src="footer.xhtml" />
            </ui:insert>
        </div>
    </div>
    <ui:insert name="scriptblock" />
    <p:dialog header="#{appmsg['label.login.dialog.header']}" widgetVar="loginDialog" modal="true" appendTo="@none" closable="true" onHide="clearLoginForm()">
        <h:form id="loginForm">
            <p:remoteCommand name="clearLoginForm" action="#{loginController.clearForm()}" update="loginForm" />
            <p:messages id="loginMessages" showDetail="true" />
            <div class="flex align-items-center gap-3 mb-3">
                <h:outputLabel value="#{appmsg['label.login.username']}" />
                <p:inputText value="#{loginForm.username}" />
            </div>
            <div class="flex align-items-center gap-3 mb-3">
                <h:outputLabel value="#{appmsg['label.login.password']}" />
                <p:password value="#{loginForm.password}" />
            </div>
            <div class="flex align-items-center gap-3 mb-3">
                <p:commandButton value="#{appmsg['label.login.submit']}" action="#{loginController.login()}" update="loginMessages :navForm" process="@form @this" />
                <p:commandButton value="#{appmsg['label.login.cancel']}" type="button" onclick="PF('loginDialog').hide()" />
            </div>
        </h:form>
    </p:dialog>
</h:body>
</html>
