<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui"
    template="/pages/layouts/customer-template.xhtml">

    <f:metadata>
        <f:viewAction action="#{confirmationController.init()}" />
    </f:metadata>
    <ui:define name="body">
        <div id="confirmation" class="py-3 px-4">
            <h:outputText value="Thank you for your order! Your order number is: " />
            <h:outputText value="#{confirmationForm.order.orderNumber}" />
        </div>
        <div id="status" class="py-3 px-4">
            <h:outputText value="Order Status: " />
            <h:outputText value="#{confirmationForm.order.orderStatus}" />
        </div>
        <p:dataTable var="item" value="#{confirmationForm.orderItems}">
            <p:column headerText="Title">
                <h:outputText value="#{item.book.title}" />
            </p:column>
            <p:column headerText="Price">
                <h:outputText value="#{item.price}">
                    <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
                </h:outputText>
            </p:column>
        </p:dataTable>
        <div id="orderTotal" class="py-3 px-4">
            <h:outputText value="Order Total: " />
            <h:outputText value="#{confirmationForm.order.orderTotal}">
                <f:convertNumber minFractionDigits="2" maxFractionDigits="2" />
            </h:outputText>
        </div>
    </ui:define>
</ui:composition>
