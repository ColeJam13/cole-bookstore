<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui"
    template="/pages/layouts/customer-template.xhtml">

    <f:metadata>
        <f:viewAction action="#{confirmationController.init()}" />
    </f:metadata>
    <ui:define name="body">
        <h:outputStylesheet library="css" name="forms.css" />
        <div class="confirmation py-3 px-4">
            <h:outputText value="#{appmsg['label.confirmation.thankyou']}" />
            <h:outputText value="#{confirmationForm.order.orderNumber}" />
        </div>
        <div class="orderStatus py-3 px-4">
            <h:outputText value="#{appmsg['label.confirmation.orderstatus']}" />
            <h:outputText value="#{confirmationForm.order.orderStatus}" />
        </div>
        <p:dataTable var="item" value="#{confirmationForm.orderItems}">
            <p:column headerText="#{appmsg['label.col.title']}">
                <h:outputText value="#{item.book.title}" />
            </p:column>
            <p:column headerText="#{appmsg['label.col.price']}">
                <h:outputText value="#{item.price}">
                    <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" maxFractionDigits="2" />
                </h:outputText>
            </p:column>
        </p:dataTable>
        <div class="orderTotal py-3 px-4">
            <h:outputText value="#{appmsg['label.confirmation.ordertotal']}" />
            <h:outputText value="#{confirmationForm.order.orderTotal}">
                <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" maxFractionDigits="2" />
            </h:outputText>
        </div>
    </ui:define>
</ui:composition>
