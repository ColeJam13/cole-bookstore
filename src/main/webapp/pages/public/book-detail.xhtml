<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui"
	template="/pages/layouts/customer-template.xhtml">

    <f:metadata>
        <f:viewParam name="isbn" value="#{bookDetailController.isbn}"/>
        <f:viewAction action="#{bookDetailController.init()}"/>
    </f:metadata>
	<ui:define name="body">
        <h:form>
            <div id="bookDetail">
                <div id="bookCover">
                    <h:graphicImage url="https://covers.openlibrary.org/b/isbn/#{bookDetailController.book.isbn}-L.jpg" 
                        alt="#{bookDetailController.book.title}"/>
                </div>
                <div id="bookInfo">
                    <div class="bookField">
                        <h:outputText value="Title: " styleClass="fieldLabel"/>
                        <h:outputText value="#{bookDetailController.book.title}" styleClass="fieldValue"/>
                    </div>
                    <div class="bookField">
                        <h:outputText value="Author: " styleClass="fieldLabel"/>
                        <h:outputText value="#{bookDetailController.book.author.name}" styleClass="fieldValue"/>
                    </div>
                    <div class="bookField">
                        <h:outputText value="ISBN: " styleClass="fieldLabel"/>
                        <h:outputText value="#{bookDetailController.book.isbn}" styleClass="fieldValue"/>
                    </div>
                    <div class="bookField">
                        <h:outputText value="Price: " styleClass="fieldLabel"/>
                        <h:outputText value="#{bookDetailController.book.price}" styleClass="fieldValue"/>
                    </div>
                    <div id="bookDescription">
                        <h:outputText value="Description: "/>
                        <h:outputText value="#{bookDetailController.description}"/>
                    </div>
                </div>
            </div>
        </h:form>
	</ui:define>
</ui:composition>
