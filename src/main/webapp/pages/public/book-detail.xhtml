<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui"
	template="/pages/layouts/customer-template.xhtml">

    <f:metadata>
        <f:viewParam name="isbn" value="#{bookDetailController.isbn}"/>
    </f:metadata>
	<ui:define name="body">
		<h:form>

            <h:graphicImage url="https://covers.openlibrary.org/b/isbn/#{bookDetailController.book.isbn}-L.jpg" 
            alt="#{bookDetailController.book.title}"/>

            <h:outputText value="Title: "/>
            <h:outputText value="#{bookDetailController.book.title}"/>

            <h:outputText value="Author: "/>
            <h:outputText value="#{bookDetailController.book.author.name}"/>

            <h:outputText value="ISBN: "/>
            <h:outputText value="#{bookDetailController.book.isbn}"/>

            <h:outputText value="Price: "/>
            <h:outputText value="#{bookDetailController.book.price}"/>

		</h:form>
	</ui:define>
</ui:composition>
