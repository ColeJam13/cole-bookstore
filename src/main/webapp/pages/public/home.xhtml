<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui"
	template="/pages/layouts/customer-template.xhtml">

	<ui:define name="body">
		<h:form>
			<!-- The Data Table the results show up in -->
			<p:dataTable var="book" value="#{bookSearchForm.searchResults}" id="tblResults" paginator="true" rows="15" 
			paginatorPosition="bottom" stripedRows="true" widgetVar="tblResultsVar" selectionMode="single" 
			rowKey="#{book.isbn}" selection="#{bookSearchForm.selectedBook}">
				<p:ajax event="rowSelect" listener="#{homeController.navigate()}"/>
				<f:facet name="header">
					<p:inputText id="globalFilter" onkeyup="PF('tblResultsVar').filter()" 
						placeholder="Search by title, author, or ISBN..." style="width: 400px" />
				</f:facet>
					<p:column headerText="Cover" filterable="false" sortable="false">
						<h:graphicImage url="https://covers.openlibrary.org/b/isbn/#{book.isbn}-M.jpg" 
							height="100" alt="#{book.title}"/>
					</p:column>
					<p:column headerText="Title" field="title" filterStyle="display:none">
						<h:outputText value="#{book.title}"/>
					</p:column>
					<p:column headerText="Author" field="author.name" filterStyle="display:none">
						<h:outputText value="#{book.author.name}" />
					</p:column>
					<p:column headerText="ISBN" field="isbn" filterStyle="display:none">
						<h:outputText value="#{book.isbn}" />
					</p:column>
					<p:column headerText="Price" field="price" filterStyle="display:none">
						<h:outputText value="#{book.price}" > 
							<f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" maxFractionDigits="2" />
						</h:outputText>
					</p:column>
					<p:column headerText="Add to Cart">
						<p:commandButton value="Add to Cart" action="#{cartController.addToCart(book)}" process="@this" update=":navForm" onclick="event.stopPropagation()" />
					</p:column>
				</p:dataTable>
		</h:form>
	</ui:define>
</ui:composition>
