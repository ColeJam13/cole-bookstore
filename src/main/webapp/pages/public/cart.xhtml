<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html" xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:p="http://primefaces.org/ui"
    template="/pages/layouts/customer-template.xhtml">

    <ui:define name="body">
        <h:outputStylesheet library="css" name="cart.css" />
        <h:form id="cartPageForm">
            <div class="flex gap-3 p-4 align-items-start">
                <div class="flex-1">
                    <p:dataTable var="cart" value="#{cartForm.cartItems}" id="cartTable">
                        <p:column headerText="#{appmsg['label.col.cover']}" filterable="false" sortable="false">
                            <h:graphicImage url="https://covers.openlibrary.org/b/isbn/#{cart.isbn}-M.jpg"
                                height="100" alt="#{cart.title}"/>
                        </p:column>
                        <p:column headerText="#{appmsg['label.col.title']}" field="title" filterStyle="display:none">
                            <h:outputText value="#{cart.title}"/>
                        </p:column>
                        <p:column headerText="#{appmsg['label.col.price']}" field="price" filterStyle="display:none">
                            <h:outputText value="#{cart.price}">
                                <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" maxFractionDigits="2" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{appmsg['label.col.remove']}" filterable="false" sortable="false">
                            <p:commandButton icon="pi pi-times" action="#{cartController.removeFromCart(cart)}" style="font-size: 1.25rem" />
                        </p:column>
                    </p:dataTable>
                </div>
                <div class="cartSummaryPanel p-4">
                    <h:panelGroup id="cartSummary">
                        <div class="summaryField flex justify-content-between mb-2">
                            <h:outputText value="#{appmsg['label.cart.subtotal']}"/>
                            <h:outputText value="#{cartForm.subTotal}">
                                <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" maxFractionDigits="2"/>
                            </h:outputText>
                        </div>
                        <div class="summaryField flex justify-content-between mb-2">
                            <h:outputText value="#{appmsg['label.cart.tax']}"/>
                            <h:outputText value="#{cartForm.tax}">
                                <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" maxFractionDigits="2"/>
                            </h:outputText>
                        </div>
                        <div class="summaryField flex justify-content-between mb-2">
                            <h:outputText value="#{appmsg['label.cart.total']}"/>
                            <h:outputText value="#{cartForm.total}">
                                <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" maxFractionDigits="2"/>
                            </h:outputText>
                        </div>
                    </h:panelGroup>
                    <div class="flex flex-column gap-2 mt-3">
                        <p:commandButton value="#{appmsg['label.cart.completepurchase']}" action="checkout?faces-redirect=true"/>
                        <p:commandButton value="#{appmsg['label.cart.continueshopping']}" action="home?faces-redirect=true"/>
                        <p:commandButton value="#{appmsg['label.cart.cancelorder']}" action="#{cartController.clearCart()}"/>
                    </div>
                </div>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
