<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    template="/pages/layouts/admin-template.xhtml">

    <ui:define name="body">
        <h:form>
            <p:importEnum type="com.ksm.bookstore.model.OrderStatus" />
            <p:dataTable var="orders" value="#{orderForm.orderList}" id="orderTable">
                <p:column headerText="#{appmsg['label.col.ordernumber']}" field="orderNumber">
                    <h:outputText value="#{orders.orderNumber}" />
                </p:column>
                <p:column headerText="#{appmsg['label.col.customerfirstname']}" field="customer.firstName">
                    <h:outputText value="#{orders.customer.firstName}" />
                </p:column>
                <p:column headerText="#{appmsg['label.col.customerlastname']}" field="customer.lastName">
                    <h:outputText value="#{orders.customer.lastName}" />
                </p:column>
                <p:column headerText="#{appmsg['label.col.ordertotal']}" field="orderTotal">
                    <h:outputText value="#{orders.orderTotal}" >
                        <f:convertNumber type="currency" currencySymbol="$" minFractionDigits="2" maxFractionDigits="2" />
                    </h:outputText>
                </p:column>
                <p:column headerText="#{appmsg['label.col.orderstatus']}" field="orderStatus">
                    <h:outputText value="#{orders.orderStatus}" />
                </p:column>
                <p:column headerText="#{appmsg['label.orders.actions']}" style="text-align:center">
                    <p:menuButton value="#{appmsg['label.orders.updatestatus']}">
                        <p:menuitem value="#{appmsg['label.orders.tosubmitted']}" action="#{orderController.updateOrderStatus(orders, OrderStatus.SUBMITTED)}" update="orderTable" rendered="#{orders.orderStatus != OrderStatus.SUBMITTED}" />
                        <p:menuitem value="#{appmsg['label.orders.tocancelled']}" action="#{orderController.updateOrderStatus(orders, OrderStatus.CANCELLED)}" update="orderTable" rendered="#{orders.orderStatus != OrderStatus.CANCELLED}" />
                        <p:menuitem value="#{appmsg['label.orders.tocomplete']}" action="#{orderController.updateOrderStatus(orders, OrderStatus.COMPLETE)}" update="orderTable" rendered="#{orders.orderStatus != OrderStatus.COMPLETE}" />
                    </p:menuButton>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
