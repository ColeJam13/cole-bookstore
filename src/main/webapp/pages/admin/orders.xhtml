<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	template="/pages/layouts/admin-template.xhtml">

    <ui:define name="body">
        <h:form>
            <p:dataTable var="orders" value="#{orderForm.orderList}" id="orderTable">
                <p:column headerText="Order Number" field="orderNumber">
                    <h:outputText value="#{orders.orderNumber}" />
                </p:column>
                <p:column headerText="Customer First Name" field="customerFirstName">
                    <h:outputText value="#{orders.customer.firstName}" />
                </p:column>
                <p:column headerText="Customer Last Name" field="customerLastName">
                    <h:outputText value="#{orders.customer.lastName}" />
                </p:column>
                <p:column headerText="Order Total" field="orderTotal">
                    <h:outputText value="#{orders.orderTotal}" />
                </p:column>
                <p:column headerText="Order Status" field="orderStatus">
                    <h:outputText value="#{orders.orderStatus}" />
                </p:column>
                <p:column headerText="Order Actions">
                    <p:commandButton value="Change to Submitted" action="#{orderController.submitOrder(orders)}" ajax="false"/>
                    <p:commandButton value="Change to Cancelled" action="#{orderController.cancelOrder(orders)}" ajax="false"/>
                    <p:commandButton value="Change to Complete" action="#{orderController.completeOrder(orders)}" ajax="false"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
